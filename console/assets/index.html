<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>OMNX Console</title><link rel="icon" href="/assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/style.css"></head>
<body><div class="app">
<aside><a class="brand" href="/" aria-label="OMNX Console"><span class="logo">O</span><span><strong>OMNX Console</strong><small id="consoleVersion">ACOMPANHAMENTO LOCAL</small></span></a>
<nav aria-label="Navegação principal"><button class="nav active" data-view="home"><span class="nav-icon">⌂</span><span>Visão geral</span></button><button class="nav" data-view="projects"><span class="nav-icon">▦</span><span>Projetos</span></button><button class="nav" data-view="tasks"><span class="nav-icon">☷</span><span>Tarefas</span></button><button class="nav" data-view="mockups"><span class="nav-icon">▧</span><span>Telas</span></button><button class="nav" data-view="decisions"><span class="nav-icon">◇</span><span>Decisões</span><b id="decisionBadge"></b></button></nav>
<div class="aside-bottom"><div class="local-indicator"><span></span> Sem conexão com IA</div><p>Seus arquivos.<br>Seu controle.</p><button id="addProjectBtn" class="quiet">＋ Adicionar projeto</button></div></aside>
<main><header><label class="search"><span aria-hidden="true">⌕</span><input id="search" placeholder="Filtrar esta visão…" aria-label="Filtrar esta visão"></label><label class="project-picker"><span class="sr-only">Cópia de trabalho</span><select id="projectSelect"><option value="">Todos os projetos</option></select></label><button id="refreshBtn" class="secondary" title="Atualizar sem chamar IA">↻ Atualizar</button></header>
<div class="freshness" id="freshness" role="status">Conectando ao painel local…</div><section id="content" aria-live="polite"><div class="empty"><h1>Abrindo seu painel</h1><p>Os dados ficam no computador. Nenhuma IA é chamada para navegar.</p></div></section></main></div>
<dialog id="modal"><div class="modal-head"><button id="closeModal" class="close" aria-label="Fechar detalhes">×</button></div><div id="modalBody"></div></dialog><div id="toast" class="toast hidden" role="status"></div>
<script src="/assets/app.js" defer></script></body></html>
